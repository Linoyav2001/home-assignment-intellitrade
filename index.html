<!DOCTYPE html>
<!--   Solution for Task 8: Dynamic FizzBuzz -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic FizzBuzz</title>
    <!-- Bootstrap 5 CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            padding-top: 3rem;
        }
        td.result-fizz { color: #0d6efd; font-weight: bold; }       /* Blue */
        td.result-buzz { color: #198754; font-weight: bold; }       /* Green */
        td.result-fizzbuzz { color: #dc3545; font-weight: bold; }   /* Red */
        
        .card {
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: none;
        }
        /* Sticky header for the table so it scrolls nicely */
        .table-container {
            max-height: 500px;
            overflow-y: auto;
        }
        thead th {
            position: sticky;
            top: 0;
            background-color: #343a40 !important;
            color: #f4f6f9;
            z-index: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            
            <div class="text-center mb-4">
                <h1 class="display-5 fw-bold text-dark">Dynamic FizzBuzz</h1>
                <p class="text-muted">Adjust the parameters to see the results update in real-time.</p>
            </div>

            <!-- Controls Card -->
            <div class="card mb-4 p-4">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="val1" class="form-label">Fizz Value</label>
                        <input type="number" id="val1" class="form-control" value="3" min="1">
                    </div>
                    <div class="col-md-4">
                        <label for="val2" class="form-label">Buzz Value</label>
                        <input type="number" id="val2" class="form-control" value="5" min="1">
                    </div>
                    <div class="col-md-4">
                        <label for="lengthN" class="form-label">Length (N)</label>
                        <input type="number" id="lengthN" class="form-control" value="100" min="1" max="10000">
                    </div>
                </div>
            </div>

            <!-- Results Table -->
            <div class="card table-container">
                <table class="table table-hover mb-0 text-center">
                    <thead class="table-dark">
                        <tr>
                            <th width="50%">Number</th>
                            <th width="50%">Result</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody">
                        <!-- Rows will be generated here by JavaScript -->
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<script>

/*
 * Design Considerations & Trade-offs:
 * 
 * 1. Vanilla JS vs. Frameworks (e.g., Vue.js): I opted for Vanilla JS. Given 
 *    the app's minimal state, a full framework introduces unnecessary overhead. 
 *    Simple 'input' event listeners easily achieve the required real-time reactivity.
 * 
 * 2. DOM Rendering Performance: Instead of creating elements iteratively using 
 *    document.createElement(), I build a single HTML string and inject it once 
 *    via .innerHTML. This prevents multiple expensive DOM reflows.
 * 
 * 3. Scalability for Massive Inputs: While building a single string is efficient 
 *    for reasonable values of N (e.g., up to 10,000), if N were extremely large 
 *    (e.g., millions), building and injecting a massive HTML string at once would 
 *    still block the main thread. In a real-world scenario for massive datasets, 
 *    it would be better to render the data in chunks (Pagination) or use 
 *    Virtual Scrolling to only render the rows currently visible on the screen.
 */

    // 1. Get references to DOM elements
    const val1Input = document.getElementById('val1');
    const val2Input = document.getElementById('val2');
    const lengthNInput = document.getElementById('lengthN');
    const resultsBody = document.getElementById('resultsBody');

    // 2. Core FizzBuzz generation function
    function generateFizzBuzz() {
        const val1 = parseInt(val1Input.value) || 1;
        const val2 = parseInt(val2Input.value) || 1;
        const n = parseInt(lengthNInput.value) || 0;

      // Use string concatenation to build the HTML (faster than modifying the DOM in a loop)
        let htmlContent = '';

        for (let i = 1; i <= n; i++) {
            let result = '';
            let cssClass = '';

            if (i % val1 === 0 && i % val2 === 0) {
                result = 'FizzBuzz';
                cssClass = 'result-fizzbuzz';
            } else if (i % val1 === 0) {
                result = 'Fizz';
                cssClass = 'result-fizz';
            } else if (i % val2 === 0) {
                result = 'Buzz';
                cssClass = 'result-buzz';
            } else {
                result = i;
            }

            htmlContent += `
                <tr>
                    <td class="text-muted">${i}</td>
                    <td class="${cssClass}">${result}</td>
                </tr>
            `;
        }

        // 3. Inject the generated HTML into the table
        resultsBody.innerHTML = htmlContent;
    }

    // 4. Add Event Listeners for real-time dynamic updates
    val1Input.addEventListener('input', generateFizzBuzz);
    val2Input.addEventListener('input', generateFizzBuzz);
    lengthNInput.addEventListener('input', generateFizzBuzz);

    // 5. Initial render on page load
    generateFizzBuzz();
</script>

</body>
</html>
